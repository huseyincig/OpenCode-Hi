name: Release Readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / node-${{ matrix.node }} / python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install plugin dependencies
        run: npm ci --prefix plugin
      - name: Canonical build, architecture lint, Node acceptance, validator
        run: npm run check
      - name: Python acceptance
        run: python -m pytest -q tests/test_hi.py
      - name: Build deterministic release candidate
        run: python scripts/release-build.py --out dist-ci --source-out source-ci
      - name: Verify release archives are readable
        run: python -c "import zipfile, pathlib; [zipfile.ZipFile(p).testzip() for p in pathlib.Path('.').glob('*-ci/*.zip')]"
