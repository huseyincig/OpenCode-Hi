name: Release Readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / node-${{ matrix.node }} / python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: M16 packed npm package-runner bootstrap
        run: npm run test:m16:packed-bootstrap
      - name: Native direct-Git plugin install
        env:
          OPENCODE_HI_GIT_SPEC: opencode-hi@git+https://github.com/${{ github.repository }}.git#${{ github.sha }}
        run: npm run test:direct-git-install
      - name: Exact package-target OpenCode native direct-Git host load
        env:
          OPENCODE_HI_GIT_SPEC: opencode-hi@git+https://github.com/${{ github.repository }}.git#${{ github.sha }}
        run: npm run test:direct-git-host
      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install plugin dependencies
        run: npm ci --prefix plugin
      - name: Product build, architecture lint, Node acceptance, docs parity
        run: npm run check:product
      - name: Packed public documentation
        run: npm run docs:pack-check
      - name: Python product acceptance
        run: npm run test:python:product
      - name: Build deterministic release candidate
        run: python scripts/release-build.py --out dist-ci --source-out source-ci
      - name: Verify release archives are readable
        run: python -c "import zipfile, pathlib; assert all(zipfile.ZipFile(p).testzip() is None for p in pathlib.Path('.').glob('*-ci/*.zip'))"

  evidence-certification:
    name: Evidence certification
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check evidence readiness
        id: evidence
        run: python scripts/evidence-validation-readiness.py
      - name: Evidence certification
        if: steps.evidence.outputs.ready == 'true'
        run: npm run check:evidence
      - name: Evidence pending
        if: steps.evidence.outputs.ready != 'true'
        run: echo "Evidence certification pending external exact-source receipt; product acceptance completed independently."
