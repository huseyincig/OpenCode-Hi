<!doctype html><meta name="viewport" content="width=device-width"><input id="q"><p id="empty" hidden>No results</p><ul id="list"></ul><script>const xs=['alpha','beta'];function render(){const f=xs.filter(x=>x.includes(q.value));list.innerHTML=f.map(x=>`<li>${x}</li>`).join('')}q.oninput=render;render()</script>
